<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="curve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Forgetting Curve decorative line -->
  <path d="M 80 180 Q 200 360 432 370" fill="none" stroke="url(#curve)" stroke-width="20" stroke-linecap="round" opacity="0.4" />
  
  <!-- Target Dots representing review intervals -->
  <circle cx="120" cy="225" r="16" fill="#93c5fd" />
  <circle cx="280" cy="355" r="16" fill="#93c5fd" />

  <!-- Center Checkmark Icon -->
  <circle cx="256" cy="256" r="110" fill="#ffffff" />
  <path d="M 195 258 L 238 301 L 320 215" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
</svg>
